# Cloud 9 — `docker compose up -d --build` runs the app only (bound to 127.0.0.1:3000 for a host proxy).
# `docker compose --profile caddy up -d --build` also starts Caddy with automatic HTTPS for $DOMAIN.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: cloud9:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DB_PATH: /data/cloud9.db
      WEB_DIST: /app/dist/web
      PORT: "3000"
    volumes:
      - ./data:/data
    mem_limit: 2g
    cpus: 2.0
    ports:
      # Reachable only from the host (Nginx/Caddy on the host proxies to it).
      # For quick testing on http://<server-ip>:3000 change to "3000:3000" (revert afterwards).
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    logging: *logging

volumes:
  caddy_data: {}
  caddy_config: {}
